# enterprise-agent-suite :: full stack composition
#
# Implements the topology in agent-suite-ops/docs/runbooks/deployment-design.md.
# Three isolated networks (frontend / backend / data) prevent the frontend
# container from reaching MySQL/Redis directly.
#
# Real secrets MUST be supplied via the root .env file (never committed).
# See .env.example for the full variable list.
#
# Startup order is enforced by depends_on + healthchecks:
#   mysql -> redis -> bge-embedding -> legal-agent / recruitment-agent / data-query-agent
#
# suite-web and suite-ops-nginx are commented out until their Dockerfiles land
# (WEB-410 and OPS-620). Uncomment when those modules ship.

name: enterprise-agent-suite

networks:
  suite-frontend-net:
    name: suite-frontend-net
    driver: bridge
  suite-backend-net:
    name: suite-backend-net
    driver: bridge
  suite-data-net:
    name: suite-data-net
    driver: bridge

volumes:
  mysql_data:
    name: suite-mysql-data
  redis_data:
    name: suite-redis-data
  qdrant_data:
    name: suite-qdrant-data
  legal_kb_data:
    name: suite-legal-kb-data

services:

  mysql:
    image: mysql:8.0.36
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
      - --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/db:/docker-entrypoint-initdb.d:ro
    networks:
      - suite-data-net
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis_data:/data
    networks:
      - suite-data-net
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  bge-embedding:
    # HuggingFace TEI serving BGE-M3 (outputs dense + sparse vectors).
    # Used by legal-agent for hybrid retrieval per ADR-0012.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    restart: unless-stopped
    command: ["--model-id", "BAAI/bge-m3", "--port", "8080"]
    environment:
      TZ: Asia/Shanghai
    networks:
      - suite-data-net
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  bge-reranker:
    # HuggingFace TEI serving BGE-Reranker-v2-m3 cross-encoder.
    # Used by legal-agent to rerank Qdrant hybrid candidates per ADR-0012.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    restart: unless-stopped
    command: ["--model-id", "BAAI/bge-reranker-v2-m3", "--port", "8081"]
    environment:
      TZ: Asia/Shanghai
    networks:
      - suite-data-net
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  qdrant:
    # Vector store for legal KB hybrid retrieval (dense + sparse + payload).
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    environment:
      QDRANT__LOG_LEVEL: INFO
      TZ: Asia/Shanghai
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - suite-data-net
    ports:
      - "6333:6333"
      - "6334:6334"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  legal-agent:
    build:
      context: ../agents/legal-consulting-agent
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      bge-embedding:
        condition: service_healthy
      bge-reranker:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    env_file:
      - ../agents/legal-consulting-agent/.env
    environment:
      TZ: Asia/Shanghai
    networks:
      - suite-backend-net
      - suite-data-net
    ports:
      - "8101:8101"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8101/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  recruitment-agent:
    build:
      context: ../agents/recruitment-assistant-agent
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../agents/recruitment-assistant-agent/.env
    environment:
      TZ: Asia/Shanghai
    networks:
      - suite-backend-net
      - suite-data-net
    ports:
      - "8102:8102"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8102/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  data-query-agent:
    build:
      context: ../agents/data-query-agent
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../agents/data-query-agent/.env
    environment:
      TZ: Asia/Shanghai
    networks:
      - suite-backend-net
      - suite-data-net
    ports:
      - "8103:8103"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8103/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

